<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clash Lane Campaign</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Clash Lane Campaign</h1>
      <div class="hud">
        <span id="levelName">Level 1</span>
        <span>Elixir: <strong id="elixirValue">0.0</strong>/10</span>
        <span>Time: <strong id="timeValue">0</strong>s</span>
      </div>
      <div class="topbar-actions">
        <button id="startBtn" type="button">Start Level</button>
        <button id="resetBtn" type="button">Reset Run</button>
      </div>
    </header>

    <section class="campaign" id="campaignButtons" aria-label="Campaign levels"></section>

    <section class="battle-wrap">
      <canvas id="battlefield" width="1000" height="500"></canvas>
      <aside class="battle-info">
        <p>Pick a card, then place in a lane.</p>
        <p>Lane: <strong id="selectedLane">None</strong></p>
        <p>Card: <strong id="selectedCard">None</strong></p>
        <p id="statusText">Ready for battle.</p>
        <div class="tower-health">
          <h3>Tower HP</h3>
          <p>Your King: <strong id="playerKingHp">0</strong></p>
          <p>Enemy King: <strong id="enemyKingHp">0</strong></p>
        </div>
      </aside>
    </section>

    <section class="lane-controls" aria-label="Lane controls">
      <button class="lane-btn" data-lane="0">Top Lane</button>
      <button class="lane-btn" data-lane="1">Mid Lane</button>
      <button class="lane-btn" data-lane="2">Bottom Lane</button>
    </section>

    <section class="card-bar" id="cardBar" aria-label="Character cards"></section>
  </main>

  <script src="characters.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
